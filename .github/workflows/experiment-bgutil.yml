name: bgutil-sigsegv-experiment
on: workflow_dispatch
jobs:
  build-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        env_name: ["container-2204", "native-2404"]
    runs-on: ubuntu-latest
    container: ${{ matrix.env_name == 'container-2204' && 'ubuntu:22.04' || null }}
    steps:
      - name: Environment info
        run: |
          cat /etc/os-release | head -2
          ldd --version | head -1
      - name: Install rust + git
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl clang lld || true
      - uses: dtolnay/rust-toolchain@1.94
      - name: Clone and build bgutil v0.8.1 (exact upstream recipe)
        run: |
          git clone --depth 1 --branch v0.8.1 https://github.com/jim60105/bgutil-ytdlp-pot-provider-rs /tmp/bg
          cd /tmp/bg
          cargo build --release --locked --features ffi
          BIN=$(find target/release -maxdepth 1 -type f -executable -name "*pot*")
          echo "BIN=$BIN"
          ls -la "$BIN"
          file "$BIN"
          ldd "$BIN" || true
      - name: Smoke test --version
        run: |
          BIN=$(find /tmp/bg/target/release -maxdepth 1 -type f -executable -name "*pot*")
          "$BIN" --version && echo "SMOKE OK" || echo "SMOKE FAILED rc=$?"
